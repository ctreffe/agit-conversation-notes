# Workflow docs only; conversation QMD is external and unversioned.
# See CONVERSATION_STORAGE.md and ignored CONVERSATION_PATHS.local.md.
project:
  type: website
  output-dir: output/html
  render:
    - /docs/**/*.qmd
    - "!/docs/**/DOCUMENT_CONTEXT.md"

website:
  title: "AGIT Conversation Notes — Workflow"
  navbar:
    left:
      - href: docs/index.qmd
        text: English
      - href: docs/index.de.qmd
        text: Deutsch

format:
  html:
    toc: true
    number-sections: true
    theme: cosmo

